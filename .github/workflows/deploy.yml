name: Deploy project to our server

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Deploy to FTP Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to FTP Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.teanatureltd.com
          username: teanature@teanatureltd.com
          password: "Q89661MDXQZPIC0U"
          protocol: ftps
          port: 21

          # 🕒 Extended timeout (1 hour)
          timeout: 3600000        # 1 hour in milliseconds
#          dataTimeout: 3600000    # 1 hour in milliseconds

          # 🔁 Retry settings
#          retryCount: 5
#          retryDelay: 10

          # 🔐 Connection & debug
          security: loose
#          verbose: true
