name: Deploy via SFTP (SCP)
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # (Optional) যদি build লাগে (Laravel/React/etc) এখানে build করবেন

      - name: Upload to Hostinger via SFTP (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.61.233.228       # e.g. 72.61.233.228 or your domain
          username: teanatureftp   # e.g. teanatureftp বা ssh user
          key: "PeFiO7osC11plGkZmsKH"    # PRIVATE KEY (-----BEGIN OPENSSH PRIVATE KEY-----)
          port: 22
#          source: "./*"                             # project files
